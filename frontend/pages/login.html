<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ - โชว์ของ</title>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-blue-600">เข้าสู่ระบบ</h1>
      <p class="text-gray-500 mt-2">ยินดีต้อนรับกลับสู่ โชว์ของ</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Email หรือ Username</label>
        <input type="text" id="loginEmail" required class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="loginPassword" required class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2.5 px-4 rounded-md hover:bg-blue-700 transition duration-200">
        เข้าสู่ระบบ
      </button>

      <div class="text-center mt-4 text-sm text-gray-500">
        ยังไม่มีบัญชี? <a href="/pages/register.html" class="text-blue-600 hover:underline">สมัครสมาชิกที่นี่</a>
      </div>
      <p id="errorMessage" class="text-red-500 text-sm text-center hidden"></p>
    </form>
  </div>

  <!-- ดึง CSS และ JS หลักมาใช้ -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
